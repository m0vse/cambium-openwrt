name: Cambium snapshot

# Daily: rebase the Cambium commits onto upstream OpenWrt main, build every
# Cambium family, then publish a GitHub release and the matching package feed.

on:
  schedule:
    # One evening run (19:17 UTC: 20:17 BST, 19:17 GMT). GitHub may start
    # scheduled runs hours late, so an evening start still finishes overnight.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      sync:
        description: Rebase onto upstream OpenWrt before building
        type: boolean
        default: true
      force:
        description: Build even if upstream has not changed
        type: boolean
        default: false
      families:
        description: Families to build (space separated)
        type: string
        default: sage thor cheetah jaguar
      republish_run:
        description: Only publish the build output of this earlier run ID (no sync or build)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cambium-snapshot
  cancel-in-progress: false

env:
  # The sync job adds an 'upstream' remote for openwrt/openwrt, which gh would
  # otherwise prefer. Every gh command must act on this fork only.
  GH_REPO: ${{ github.repository }}
  GIT_AUTHOR_NAME: Phil Taylor
  GIT_AUTHOR_EMAIL: phil@m0vse.uk
  GIT_COMMITTER_NAME: Phil Taylor
  GIT_COMMITTER_EMAIL: phil@m0vse.uk

jobs:
  sync:
    name: Sync with upstream
    if: ${{ !inputs.republish_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      actions: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      upstream: ${{ steps.result.outputs.upstream }}
      build: ${{ steps.result.outputs.build }}
      build_id: ${{ steps.result.outputs.build_id }}
      families: ${{ steps.result.outputs.families }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Rebasing can carry upstream workflow changes, which GITHUB_TOKEN
          # may not push. A token with contents and workflows write access
          # avoids that.
          token: ${{ secrets.CAMBIUM_SYNC_TOKEN || github.token }}

      - name: Keep upstream OpenWrt workflows disabled in this fork
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: cambium/scripts/disable-upstream-workflows.sh

      - name: Rebase Cambium commits onto upstream
        id: sync
        if: github.event_name == 'schedule' || inputs.sync
        run: cambium/scripts/sync-upstream.sh

      - name: Report rebase conflict
        if: failure() && steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.sync.outputs.conflict_commit }}
          SUBJECT: ${{ steps.sync.outputs.conflict_subject }}
          FILES: ${{ steps.sync.outputs.conflict_files }}
          UPSTREAM: ${{ steps.sync.outputs.upstream }}
        run: |
          title="Upstream sync conflict: $SUBJECT"
          body="The daily rebase onto upstream OpenWrt \`${UPSTREAM}\` stopped at
          Cambium commit \`${COMMIT}\` (${SUBJECT}).

          Conflicting files: \`${FILES}\`

          The branch and the last published snapshot are unchanged. Rebase
          locally with \`cambium/scripts/sync-upstream.sh\`, resolve, and
          force-push; the next scheduled run then continues normally.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create upstream-sync --color d93f0b --force >/dev/null
            gh issue create --title "$title" --label upstream-sync --body "$body"
          fi

      - name: Push rebased branch
        if: steps.sync.outputs.rebased == 'true'
        env:
          OLD: ${{ steps.sync.outputs.old_head }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: git push --force-with-lease="$BRANCH:$OLD" origin "HEAD:$BRANCH"

      - name: Disable any workflows added by upstream
        continue-on-error: true
        if: steps.sync.outputs.rebased == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cambium/scripts/disable-upstream-workflows.sh

      - name: Test the Sage sysupgrade logic
        run: sh cambium/tests/sage-sysupgrade.sh

      - name: Check the hardware report script is read-only
        run: sh cambium/tests/cambium-report.sh

      - name: Test the installer against every family
        run: sh cambium/tests/cambium-install.sh

      - name: Test the stock-style hostname
        run: sh cambium/tests/cambium-hostname.sh

      - name: Test the shared A/B logic (every family module)
        run: sh cambium/tests/cambium-ab.sh

      - name: Test the shared OpenWISP status LED
        run: sh cambium/tests/cambium-openwisp-led.sh

      - name: Test the management VLAN defaults (every family)
        run: sh cambium/tests/cambium-vlan.sh

      - name: Test the persistent image release gate
        run: sh cambium/tests/rootfs-gate.sh
      - name: Test the RRM measurement agent
        run: sh cambium/tests/cambium-rrm.sh

      - name: Render the changelogs
        run: |
          python3 cambium/scripts/changelog.py html cambium/changelog cambium/site/index.html > /dev/null
          python3 cambium/scripts/changelog.py unreleased cambium/changelog

      - name: Watch for a new OpenWrt stable branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Release builds start with the first stable series that branches
          # from main after the qualcommax Ethernet rework (see cambium/README.md).
          KNOWN_STABLE: '25.12'
        run: |
          latest=$(git ls-remote --heads https://github.com/openwrt/openwrt.git 'refs/heads/openwrt-*' |
            sed 's|.*refs/heads/openwrt-||' | sort -V | tail -n 1)
          echo "Latest upstream stable branch: openwrt-$latest"
          [ "$(printf '%s\n%s\n' "$KNOWN_STABLE" "$latest" | sort -V | tail -n 1)" != "$KNOWN_STABLE" ] || exit 0
          title="New OpenWrt stable branch: openwrt-$latest"
          [ -z "$(gh issue list --state all --search "$title in:title" --json number --jq '.[].number')" ] || exit 0
          gh label create stable-branch --color 0e8a16 --force >/dev/null
          gh issue create --label stable-branch --title "$title" --body "Upstream OpenWrt has created \`openwrt-$latest\`.

          Release builds for the Cambium families start from this series: port the Cambium commits onto the branch, check the device trees and kernel patches against its kernel, then enable tagged release builds (see cambium/README.md)."

      - name: Decide build
        id: result
        if: ${{ !cancelled() && steps.sync.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REBASED: ${{ steps.sync.outputs.rebased }}
          FORCE: ${{ inputs.force }}
          FAMILIES: ${{ inputs.families || 'sage thor cheetah jaguar' }}
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git merge-base HEAD upstream/main 2>/dev/null || echo "$head")" >> "$GITHUB_OUTPUT"
          # A snapshot of this commit counts only for the families it actually
          # contains, so a family that failed is built again on the next run.
          tags=$(git ls-remote --tags origin 'refs/tags/snapshot-*' |
            awk -v h="$head" '$1 == h { sub("refs/tags/", "", $2); print $2 }')
          assets=$(for tag in $tags; do
            gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true
          done)
          missing=
          for family in $FAMILIES; do
            printf '%s\n' "$assets" | grep -q "cambiumnetworks_$family-persistent" ||
              missing="$missing $family"
          done
          if [ "$REBASED" = true ] || [ "$FORCE" = true ] || [ -n "$missing" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            [ -z "$missing" ] ||
              echo "No snapshot of this commit contains:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to build." >> "$GITHUB_STEP_SUMMARY"
          fi
          day=$(date -u +%Y.%m.%d)
          n=$(git ls-remote --tags origin "refs/tags/snapshot-$day.*" | wc -l)
          echo "build_id=$day.$n" >> "$GITHUB_OUTPUT"
          echo "families=$(printf '%s\n' $FAMILIES | jq -Rcs 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.family }}
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.sync.outputs.families) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget zstd device-tree-compiler

      - name: Install the UBIFS reader for the release gate
        run: |
          python3 -m venv "$RUNNER_TEMP/ubi"
          "$RUNNER_TEMP/ubi/bin/pip" install --quiet ubi_reader==0.8.12
          echo "UBIREADER_EXTRACT=$RUNNER_TEMP/ubi/bin/ubireader_extract_files" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - name: Add upstream reference
        run: git fetch --no-tags https://github.com/openwrt/openwrt.git main:refs/remotes/upstream/main

      - name: Restore source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ matrix.family }}-${{ github.run_id }}
          restore-keys: dl-${{ matrix.family }}-

      - name: Build and verify
        env:
          CAMBIUM_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CAMBIUM_APK_PRIVATE_KEY: ${{ secrets.CAMBIUM_APK_PRIVATE_KEY }}
        run: cambium/scripts/build.sh ${{ matrix.family }} ${{ needs.sync.outputs.build_id }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: cambium-${{ matrix.family }}
          path: cambium-output/${{ matrix.family }}
          retention-days: 7
          compression-level: 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.family }}
          path: logs
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish snapshot
    needs: [sync, build]
    if: ${{ !cancelled() && (needs.sync.outputs.build == 'true' || inputs.republish_run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: cambium-*
          path: out
          run-id: ${{ inputs.republish_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish release and package feeds
        env:
          # GITHUB_TOKEN may not create a tag on a commit whose workflow files
          # differ from the default branch (e.g. after a later fix), so use
          # the sync token when it is configured.
          GH_TOKEN: ${{ secrets.CAMBIUM_SYNC_TOKEN || github.token }}
          BUILD_ID: ${{ needs.sync.outputs.build_id }}
          SHA: ${{ needs.sync.outputs.sha }}
          UPSTREAM: ${{ needs.sync.outputs.upstream }}
          FAMILIES_JSON: ${{ needs.sync.outputs.families }}
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          FAMILIES=$(printf '%s' "${FAMILIES_JSON:-[]}" | jq -r 'join(" ")')
          export FAMILIES
          cambium/scripts/publish.sh out
