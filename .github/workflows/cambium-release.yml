name: Cambium release

# Release builds: Cambium on OpenWrt's final stable releases (never release
# candidates), from the first series after 25.12. For series X.Y the branch
# cambium-X.Y is created by porting main's Cambium commits onto the series'
# release, and afterwards only moves forward: each newer upstream point
# release is merged in, and Cambium fixes are cherry-picked from main. Each
# build is tagged release-X.Y.Z-N and published as a release candidate, then
# promoted with the 'promote' action once it has been validated on hardware.
# See cambium/README.md.
#
# The snapshot workflow starts this one when upstream has a final release
# that has no Cambium release build yet.

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: update (port/merge and build if needed) or promote (mark a validated candidate as the release)
        type: choice
        options: [update, promote]
        default: update
      series:
        description: OpenWrt series X.Y to update (default the newest with a final release)
        type: string
        default: ''
      force:
        description: Build even if this branch head already has a release build
        type: boolean
        default: false
      families:
        description: Families to build (space separated)
        type: string
        default: sage thor cheetah jaguar gambit
      tag:
        description: For promote, the release tag (release-X.Y.Z-N)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cambium-release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GIT_AUTHOR_NAME: Phil Taylor
  GIT_AUTHOR_EMAIL: phil@m0vse.uk
  GIT_COMMITTER_NAME: Phil Taylor
  GIT_COMMITTER_EMAIL: phil@m0vse.uk

jobs:
  prepare:
    name: Update the release branch
    if: ${{ inputs.action != 'promote' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    outputs:
      build: ${{ steps.result.outputs.build }}
      sha: ${{ steps.branch.outputs.sha }}
      upstream_tag: ${{ steps.branch.outputs.upstream_tag }}
      build_id: ${{ steps.result.outputs.build_id }}
      families: ${{ steps.result.outputs.families }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # The release branch carries this fork's workflow files, which
          # GITHUB_TOKEN may not push.
          token: ${{ secrets.CAMBIUM_SYNC_TOKEN || github.token }}

      - name: Port or merge the newest OpenWrt release
        id: branch
        env:
          SERIES: ${{ inputs.series }}
        run: |
          set +e
          cambium/scripts/release-branch.sh $SERIES
          rc=$?
          echo "status=$rc" >> "$GITHUB_OUTPUT"
          case $rc in
          0) ;;
          2) echo "No final OpenWrt release after 25.12 yet: nothing to build." >> "$GITHUB_STEP_SUMMARY" ;;
          *) exit $rc ;;
          esac

      - name: Report a release port conflict
        if: failure() && steps.branch.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.branch.outputs.conflict_commit }}
          SUBJECT: ${{ steps.branch.outputs.conflict_subject }}
          FILES: ${{ steps.branch.outputs.conflict_files }}
        run: |
          title="Release branch conflict: $SUBJECT"
          body="Updating the Cambium release branch stopped at \`${COMMIT}\` (${SUBJECT}).

          Conflicting files: \`${FILES}\`

          Nothing was pushed. Port or merge by hand with
          \`cambium/scripts/release-branch.sh\` (see cambium/README.md), push
          the \`cambium-X.Y\` branch, then run this workflow again.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --label release-branch --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create release-branch --color 0e8a16 --force >/dev/null
            gh issue create --title "$title" --label release-branch --body "$body"
          fi

      - name: Push the release branch
        if: steps.branch.outputs.action == 'ported' || steps.branch.outputs.action == 'merged'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        # Never forced: a release branch only moves forward.
        run: git push origin "HEAD:refs/heads/$BRANCH"

      - name: Run every test suite on the release branch
        if: steps.branch.outputs.status == '0'
        run: |
          failed=
          for t in cambium/tests/*.sh; do
            echo "::group::$t"
            sh "$t" || failed="$failed ${t##*/}"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "Failed:$failed" >&2; exit 1; }

      - name: Decide build
        id: result
        if: steps.branch.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.branch.outputs.version }}
          FORCE: ${{ inputs.force }}
          FAMILIES: ${{ inputs.families || 'sage thor cheetah jaguar gambit' }}
        run: |
          head=$(git rev-parse HEAD)
          # As for snapshots, a build of this commit counts only for the
          # families it contains.
          tags=$(git ls-remote --tags origin "refs/tags/release-$VERSION-*" |
            awk -v h="$head" '$1 == h { sub("refs/tags/", "", $2); print $2 }')
          assets=$(for tag in $tags; do
            gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true
          done)
          missing=
          for family in $FAMILIES; do
            # Gambit counts only with its whole bundle (see the snapshot workflow).
            case "$family" in
            gambit) want="cambiumnetworks_e400-recovery-initramfs cambiumnetworks_gambit-installer-initramfs
              cambiumnetworks_gambit-persistent-squashfs-kernel cambiumnetworks_gambit-persistent-squashfs-rootfs
              cambiumnetworks_gambit-persistent-squashfs-sysupgrade" ;;
            *) want=cambiumnetworks_$family-persistent ;;
            esac
            for built in $want; do
              printf '%s\n' "$assets" | grep -q "$built" || { missing="$missing $family"; break; }
            done
          done
          if [ "$FORCE" = true ] || [ -n "$missing" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION: this branch head is already built." >> "$GITHUB_STEP_SUMMARY"
          fi
          n=$(git ls-remote --tags origin "refs/tags/release-$VERSION-*" | wc -l)
          echo "build_id=$VERSION-$((n + 1))" >> "$GITHUB_OUTPUT"
          echo "families=$(printf '%s\n' $FAMILIES | jq -Rcs 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.family }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.prepare.outputs.families) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget zstd device-tree-compiler

      - name: Install the UBIFS reader for the release gate
        run: |
          python3 -m venv "$RUNNER_TEMP/ubi"
          "$RUNNER_TEMP/ubi/bin/pip" install --quiet ubi_reader==0.8.12
          echo "UBIREADER_EXTRACT=$RUNNER_TEMP/ubi/bin/ubireader_extract_files" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Add the upstream release tag
        env:
          TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: git fetch --no-tags https://github.com/openwrt/openwrt.git "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Restore source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-release-${{ matrix.family }}-${{ github.run_id }}
          restore-keys: dl-release-${{ matrix.family }}-

      - name: Build and verify
        env:
          CAMBIUM_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CAMBIUM_APK_PRIVATE_KEY: ${{ secrets.CAMBIUM_APK_PRIVATE_KEY }}
          CAMBIUM_UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_tag }}
        run: cambium/scripts/build.sh ${{ matrix.family }} ${{ needs.prepare.outputs.build_id }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: cambium-${{ matrix.family }}
          path: cambium-output/${{ matrix.family }}
          retention-days: 14
          compression-level: 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.family }}
          path: logs
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release candidate
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    # One writer of gh-pages at a time, snapshots included.
    concurrency:
      group: cambium-pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: cambium-*
          path: out

      - name: Publish release candidate and package feeds
        env:
          GH_TOKEN: ${{ secrets.CAMBIUM_SYNC_TOKEN || github.token }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          SHA: ${{ needs.prepare.outputs.sha }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          FAMILIES_JSON: ${{ needs.prepare.outputs.families }}
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          UPSTREAM=$(git ls-remote https://github.com/openwrt/openwrt.git "refs/tags/$UPSTREAM_TAG^{}" | cut -f1)
          FAMILIES=$(printf '%s' "${FAMILIES_JSON:-[]}" | jq -r 'join(" ")')
          export UPSTREAM FAMILIES
          cambium/scripts/publish.sh out

  promote:
    name: Promote ${{ inputs.tag }}
    if: ${{ inputs.action == 'promote' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark the validated candidate as the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
          release-[0-9]*.[0-9]*.[0-9]*-[0-9]*) ;;
          *) echo "Not a release tag: $TAG" >&2; exit 1 ;;
          esac
          gh release view "$TAG" --json isPrerelease --jq .isPrerelease | grep -qx true ||
            { echo "$TAG is not a release candidate" >&2; exit 1; }
          gh release view "$TAG" --json body --jq .body |
            sed '/^\*\*Release candidate\*\*/,/^$/d' > notes.md
          gh release edit "$TAG" --prerelease=false --latest \
            --title "Cambium OpenWrt ${TAG#release-}" --notes-file notes.md
          echo "Promoted $TAG to the latest release." >> "$GITHUB_STEP_SUMMARY"
